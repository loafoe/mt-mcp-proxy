{{- range .Values.tenants }}
{{- if and .credentialSecret.create .credentialSecret.value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .credentialSecret.name }}"
  labels:
    {{- include "mt-mcp-proxy.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ .credentialSecret.key | default "token" }}: "{{ .credentialSecret.value }}"
{{- end }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mt-mcp-proxy.fullname" . }}-config
  labels:
    {{- include "mt-mcp-proxy.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      listen: ":{{ .Values.server.port | default 8080 }}"
      path: "{{ .Values.server.path | default "/mcp" }}"
    observability:
      {{- if .Values.metrics.enabled }}
      metrics_listen: ":{{ .Values.metrics.port | default 9090 }}"
      metrics_path: "{{ .Values.metrics.path | default "/metrics" }}"
      {{- else }}
      metrics_listen: ""
      {{- end }}
    auth:
      mode: "{{ .Values.auth.mode | default "jwks" }}"
      groups_claim: "{{ .Values.auth.groupsClaim | default "groups" }}"
      issuer: "{{ .Values.auth.issuer }}"
      audience: "{{ .Values.auth.audience }}"
      {{- with .Values.auth.additionalAudiences }}
      additional_audiences:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.auth.jwksUrl }}
      jwks_url: "{{ .Values.auth.jwksUrl }}"
      {{- end }}
      {{- if eq .Values.auth.mode "static" }}
      {{- if .Values.auth.hmacSecret }}
      hmac_secret: "{{ .Values.auth.hmacSecret }}"
      {{- end }}
      {{- if .Values.auth.publicKeyPemFile }}
      public_key_pem_file: "/etc/mt-mcp-proxy/keys/public.pem"
      {{- end }}
      {{- end }}
    backends:
      {{- range .Values.backends }}
      - name: "{{ .name }}"
        {{- if .managed.enabled }}
        url: "http://{{ include "mt-mcp-proxy.fullname" $ }}-{{ .name }}-backend:{{ .managed.port | default 8082 }}/"
        {{- else }}
        url: "{{ required (printf "backends[%s].externalUrl is required when managed.enabled is false" .name) .externalUrl }}"
        {{- end }}
        {{- if and .credentialSecret .credentialSecret.name }}
        credential: {{ printf "${%s}" (include "mt-mcp-proxy.backendCredEnv" .name) | quote }}
        {{- end }}
        credential_header: "{{ .credentialHeader | default "Authorization" }}"
        credential_scheme: "{{ .credentialScheme | default "Bearer" }}"
        {{- with .headers }}
        headers:
          {{- range $k, $v := . }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
        {{- end }}
        tenants:
          {{- range .tenants }}
          - id: "{{ .id }}"
            groups:
              {{- range .groups }}
              - "{{ . }}"
              {{- end }}
            {{- if and .credentialSecret .credentialSecret.name }}
            credential: {{ printf "${%s}" (include "mt-mcp-proxy.credEnv" .id) | quote }}
            {{- end }}
            {{- with .headers }}
            headers:
              {{- range $k, $v := . }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
      {{- end }}
